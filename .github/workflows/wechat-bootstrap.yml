name: WeChat bootstrap

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start a QR session or complete a scanned session
        required: true
        type: choice
        options:
          - start
          - complete
          - status
          - refresh
          - refresh-all
          - resolve
          - news-refresh
          - host-check
          - desktop-enroll
          - werss-install
          - werss-status
      login_id:
        description: Login session id returned by the start operation
        required: false
        type: string
      article_url:
        description: WeChat article URL used by the resolve operation
        required: false
        type: string
      token_hash:
        description: SHA-256 hash for the local WeChat desktop collector token
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: WeChat ${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ vars.PVHOT_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.PVHOT_DEPLOY_PORT || '22' }}
      DEPLOY_USER: pvhot-deploy
      OPERATION: ${{ inputs.operation }}
      LOGIN_ID: ${{ inputs.login_id }}
      ARTICLE_URL: ${{ inputs.article_url }}
      TOKEN_HASH: ${{ inputs.token_hash }}
    steps:
      - name: Configure restricted SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PVHOT_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PVHOT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" >"${HOME}/.ssh/pvhot_deploy"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/pvhot_deploy" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/pvhot_deploy" >/dev/null

      - name: Run production bootstrap operation
        shell: bash
        run: |
          set -euo pipefail
          destination="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(
            -i "${HOME}/.ssh/pvhot_deploy"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )
          ssh "${ssh_options[@]}" "${destination}" \
            bash -s -- "${OPERATION}" "${LOGIN_ID:-_}" "${ARTICLE_URL:-_}" "${TOKEN_HASH:-_}" <<'REMOTE'
          set -euo pipefail
          operation="$1"
          login_id="${2:-}"
          article_url="${3:-}"
          token_hash="${4:-}"
          if [[ "${operation}" == "werss-install" || "${operation}" == "werss-status" ]]; then
            container="pvhot-werrs"
            data_dir="/var/www/pvhot/shared/we-mp-rss-data"
            if [[ "${operation}" == "werss-install" ]]; then
              command -v docker >/dev/null
              docker info >/dev/null
              install -d -m 2770 "${data_dir}"
              image=""
              for candidate in \
                "docker.1ms.run/rachelos/we-mp-rss:latest" \
                "ghcr.io/rachelos/we-mp-rss:latest" \
                "rachelos/we-mp-rss:latest"; do
                printf 'Trying image %s\n' "${candidate}"
                if timeout 180 docker pull "${candidate}"; then
                  image="${candidate}"
                  break
                fi
              done
              [[ -n "${image}" ]]
              if docker container inspect "${container}" >/dev/null 2>&1; then
                docker rm -f "${container}" >/dev/null
              fi
              docker run -d \
                --name "${container}" \
                --restart unless-stopped \
                -p 8001:8001 \
                -e TZ=Asia/Shanghai \
                -e ENABLE_JOB=True \
                -e PORT=8001 \
                -v "${data_dir}:/app/data" \
                "${image}"
              sleep 5
            fi
            docker ps -a --filter "name=^/${container}$" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8001/ >/dev/null
            printf 'WeRSS is responding on port 8001\n'
            exit 0
          fi
          token_file="/var/www/pvhot/shared/config/wechat-bootstrap-token"
          [[ -f "${token_file}" && ! -L "${token_file}" ]]
          token="$(<"${token_file}")"
          [[ "${#token}" -ge 32 ]]
          if [[ "${operation}" == "start" ]]; then
            endpoint="start"
            payload='{}'
          elif [[ "${operation}" == "complete" ]]; then
            [[ "${login_id}" =~ ^[A-Za-z0-9_-]{6,80}$ ]]
            endpoint="complete"
            payload="{\"id\":\"${login_id}\"}"
          elif [[ "${operation}" == "status" || "${operation}" == "refresh" ]]; then
            endpoint="${operation}"
            payload='{}'
          elif [[ "${operation}" == "refresh-all" ]]; then
            endpoint="refresh"
            payload='{}'
          elif [[ "${operation}" == "resolve" ]]; then
            case "${article_url}" in
              https://mp.weixin.qq.com/s/*) ;;
              *) printf 'Invalid WeChat article URL\n' >&2; exit 2 ;;
            esac
            endpoint="resolve"
            payload="{\"url\":\"${article_url}\"}"
          elif [[ "${operation}" == "news-refresh" ]]; then
            endpoint="news-refresh"
            payload='{}'
          elif [[ "${operation}" == "host-check" ]]; then
            printf 'docker='; command -v docker || true
            printf 'podman='; command -v podman || true
            printf 'python='; command -v python3 || true
            printf 'docker-access='; docker info --format '{{.ServerVersion}}' 2>/dev/null || printf 'unavailable\n'
            printf 'docker-ps='; docker ps --format '{{.ID}}' 2>&1 | head -n 2 || true
            printf 'sudo-docker='; sudo -n docker info --format '{{.ServerVersion}}' 2>&1 || true
            printf 'identity='; id
            printf 'podman-access='; podman info --format '{{.Version.Version}}' 2>/dev/null || printf 'unavailable\n'
            exit 0
          elif [[ "${operation}" == "desktop-enroll" ]]; then
            [[ "${token_hash}" =~ ^[a-f0-9]{64}$ ]]
            target="/var/www/pvhot/shared/config/wechat-desktop-token.sha256"
            temporary="$(mktemp /var/www/pvhot/shared/config/.wechat-desktop-token.XXXXXX)"
            printf '%s\n' "${token_hash}" >"${temporary}"
            chgrp pvhot "${temporary}"
            chmod 0640 "${temporary}"
            mv -f -- "${temporary}" "${target}"
            printf '{"ok":true,"operation":"desktop-enroll"}\n'
            exit 0
          else
            printf 'Unsupported operation\n' >&2
            exit 2
          fi
          call_api() {
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "X-PVHOT-Bootstrap-Token: ${token}" \
              --data "$1" \
              "http://127.0.0.1:8777/internal/wechat-bootstrap/${endpoint}"
            printf '\n'
          }
          if [[ "${operation}" == "refresh-all" ]]; then
            mp_ids=(MP_WXS_3016566024 MP_WXS_2393822661 MP_WXS_2393507962 MP_WXS_3865843012 MP_WXS_3509014347)
            for index in "${!mp_ids[@]}"; do
              if ! call_api "{\"mpId\":\"${mp_ids[$index]}\"}"; then
                printf '微信公众号 %s 本轮查询失败，继续下一个账号\n' "${mp_ids[$index]}" >&2
              fi
              if [[ "${index}" -lt 4 ]]; then sleep 60; fi
            done
            exit 0
          fi
          call_api "${payload}"
          REMOTE

      - name: Remove SSH identity
        if: always()
        shell: bash
        run: rm -f -- "${HOME}/.ssh/pvhot_deploy"
