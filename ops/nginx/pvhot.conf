# PVHOT single source of truth for Nginx.
# Install as /etc/nginx/conf.d/pvhot.conf after removing older PVHOT snippets.

limit_req_zone $binary_remote_addr zone=pvhot_api:10m rate=12r/s;

map $uri $pvhot_cache_control {
    default "";
    ~^/admin(?:/|$) "no-store";
    /release.json "no-store, max-age=0";
    /data.json "public, max-age=60, stale-while-revalidate=300";
    /data_bootstrap.json "public, max-age=300, stale-while-revalidate=3600";
    /site_texts.json "public, max-age=60, stale-while-revalidate=300";
    /uploads/qrcode.png "public, max-age=300, stale-while-revalidate=3600";
    ~^/(?:data_fallback|site_texts_fallback)\.js$ "public, max-age=60, stale-while-revalidate=300";
    ~*\.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name pvhot.bbroot.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pvhot/shared/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://pvhot.bbroot.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name pvhot.bbroot.com;

    ssl_certificate /etc/letsencrypt/live/pvhot.bbroot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pvhot.bbroot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PVHOT_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/pvhot/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header Cache-Control $pvhot_cache_control always;

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_hide_header Cache-Control;
    }

    location /api/ {
        limit_req zone=pvhot_api burst=24 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Operational and private state must never be served as static files.
    location ~ /\. {
        deny all;
    }
    location ^~ /ops/ {
        return 404;
    }
    location ^~ /lib/ {
        return 404;
    }
    location ^~ /node_modules/ {
        return 404;
    }
    location ^~ /deploy/ {
        return 404;
    }
    location = /uploads/qrcode.png {
        try_files $uri =404;
    }
    location ^~ /uploads/ {
        return 404;
    }
    location ~ ^/(?:admin_server|fetch_pv_news|fetch_prices|fetch_wechat|merge|source_registry|backfill_summary|enrich_data|verify_[^/]+)\.js$ {
        return 404;
    }
    location ~ ^/(?:admin_pass|admin_edits|data_raw|feedback|stats|source_health|translate_cache|article_cache|wechat_items)\.json$ {
        return 404;
    }
    location = /admin_pass.txt {
        return 404;
    }
    location = /admin.html {
        return 404;
    }
    location = /package.json {
        return 404;
    }
    location = /package-lock.json {
        return 404;
    }
    location = /fetch.log {
        return 404;
    }
    location ~* \.(?:py|bat)$ {
        return 404;
    }

    location = /release.json {
        try_files $uri =404;
        default_type application/json;
    }

    location = /data.json {
        try_files $uri =404;
        default_type application/json;
    }

    location = /data_bootstrap.json {
        try_files $uri =404;
        default_type application/json;
    }

    location = /site_texts.json {
        try_files $uri =404;
        default_type application/json;
    }

    location ~* ^/(?:data_fallback|site_texts_fallback)\.js$ {
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
